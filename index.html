<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --sky-top: #160b2e;
    --sky-bottom: #3a1f5c;
    --ground: #0d0818;
    --ground-line: #1c1230;
    --outline: #17101f;
    --moon: #ffe9a8;
    --paper: #f4ecd8;
    --ink: #201530;
  }
 
  * { box-sizing: border-box; }
 
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ground);
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
  }
 
  #scene {
    position: relative;
    width: 100%;
    height: 100vh;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 68%);
    overflow: hidden;
  }
 
  /* Title */
  #title-card {
    position: absolute;
    top: 22px;
    left: 26px;
    z-index: 20;
    color: var(--paper);
  }
  #title-card h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 3px 3px 0 var(--outline);
  }
  #title-card p {
    margin: 4px 0 0;
    font-size: 13px;
    font-weight: 500;
    opacity: 0.75;
  }
 
  /* Moon */
  .moon {
    position: absolute;
    top: 48px;
    right: 60px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--moon);
    box-shadow: 0 0 40px rgba(255,233,168,0.45), inset -14px -6px 0 rgba(0,0,0,0.06);
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  .moon:hover {
    box-shadow: 0 0 55px rgba(255,233,168,0.65), inset -14px -6px 0 rgba(0,0,0,0.06);
  }
 
  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--paper);
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.85; }
  }
 
  .shooting-star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.9);
    z-index: 2;
    animation: shooting-star-move 1.1s ease-in forwards;
  }
  .shooting-star::before {
    content: '';
    position: absolute;
    top: 1px;
    right: 1px;
    width: 70px;
    height: 1.5px;
    background: linear-gradient(90deg, rgba(255,255,255,0.85), transparent);
  }
  @keyframes shooting-star-move {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(-260px, 170px); opacity: 0; }
  }
 
  /* Lucioles ambiantes entre les tours */
  .firefly {
    position: absolute;
    bottom: 90px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 8px 2px rgba(255,233,168,0.75);
    opacity: 0;
    z-index: 3;
    pointer-events: none;
    animation: firefly-float 7s ease-in-out forwards;
  }
  @keyframes firefly-float {
    0% { opacity: 0; transform: translate(0, 0); }
    12% { opacity: 0.85; }
    50% { transform: translate(var(--driftX, 15px), -95px); }
    88% { opacity: 0.6; }
    100% { opacity: 0; transform: translate(calc(var(--driftX, 15px) * 2), -190px); }
  }
 
  /* Ground */
  #ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 90px;
    background: var(--ground);
    border-top: 4px solid var(--outline);
    z-index: 5;
  }
  #ground::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 0;
    width: 100%;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--ground-line) 0 22px, transparent 22px 40px);
  }
 
  #world {
    position: absolute;
    inset: 0;
    will-change: transform;
  }
 
  /* Skyline container */
  #skyline {
    position: absolute;
    bottom: 90px;
    left: 0;
    width: max-content;
    min-width: 160vw;
    display: flex;
    align-items: flex-end;
    justify-content: space-evenly;
    gap: 28px;
    padding: 0 80px;
  }
 
  /* Tower */
  .tower {
    position: relative;
    border: 4px solid var(--outline);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    box-shadow: -4px 0 0 rgba(0,0,0,0.12) inset;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
 
  .tower .roof-cap {
    position: absolute;
    top: -14px;
    left: -4px;
    right: -4px;
    height: 14px;
    background: inherit;
    filter: brightness(1.15);
    border: 4px solid var(--outline);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
 
  .tower .nameplate {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--outline);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    z-index: 3;
    box-shadow: 2px 2px 0 var(--outline);
  }
 
  .windows {
    position: absolute;
    top: 42px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    display: grid;
    gap: 8px;
  }
  .window {
    background: rgba(20,10,30,0.55);
    border: 2px solid var(--outline);
    border-radius: 2px;
  }
  .window.lit {
    background: #ffe9a8;
    box-shadow: 0 0 8px rgba(255,233,168,0.7);
    animation: flicker 6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    94% { opacity: 0.55; }
    96% { opacity: 1; }
  }
 
  /* Cats */
  .cat {
    position: absolute;
    bottom: 90px;
    width: 34px;
    height: 26px;
    z-index: 10;
  }
  .cat svg { width: 100%; height: 100%; overflow: visible; }
  .cat.walking { animation: bob 0.5s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
 
  /* Polaroid */
  .polaroid {
    position: absolute;
    bottom: 128px;
    width: 205px;
    background: var(--paper);
    border: 3px solid var(--outline);
    border-radius: 4px;
    padding: 8px 8px 10px;
    box-shadow: 3px 4px 0 var(--outline);
    transform: translateX(-50%) rotate(-4deg) scale(0.6);
    opacity: 0;
    z-index: 25;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .polaroid.show {
    opacity: 1;
    transform: translateX(-50%) rotate(-4deg) scale(1);
  }
  .polaroid .shot {
    background: #313338;
    border-radius: 3px;
    padding: 8px;
    min-height: 46px;
  }
  .polaroid-msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .polaroid-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 11px;
    overflow: hidden;
  }
  .polaroid-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .polaroid-msg-body {
    min-width: 0;
    flex: 1;
  }
  .polaroid-msg-top {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .polaroid-username {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 11px;
  }
  .polaroid-badge { font-size: 10px; }
  .polaroid-text {
    font-family: 'gg sans', 'Fredoka', sans-serif;
    font-size: 11px;
    color: #dbdee1;
    line-height: 1.35;
    margin-top: 1px;
    word-break: break-word;
  }
  .polaroid .caption {
    font-family: 'Fredoka', sans-serif;
    font-size: 10px;
    text-align: center;
    color: #6b5a3f;
    margin-top: 6px;
  }
 
  /* Flash de l'appareil photo */
  .flash-burst {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: none;
    z-index: 24;
    animation: flash-pop 0.5s ease-out forwards;
  }
  @keyframes flash-pop {
    to { transform: translate(-50%, -50%) scale(10); opacity: 0; }
  }
 
  .look-btn {
    position: absolute;
    bottom: 110px;
    width: 58px;
    height: 58px;
    border: 3px solid var(--outline);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--outline);
    z-index: 30;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .look-btn.left { left: 18px; }
  .look-btn.right { right: 18px; }
  .look-btn:hover { filter: brightness(1.05); }
  .look-btn:active,
  .look-btn.held {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--outline);
    background: #ffe9a8;
  }
 
  /* Cercle magique à particules */
  #magic-circle {
    position: fixed;
    top: 0;
    left: 0;
    width: 48px;
    height: 48px;
    margin-left: -24px;
    margin-top: -24px;
    pointer-events: none;
    z-index: 200;
    transform: translate(-100px, -100px);
  }
  #magic-circle .ring {
    position: absolute;
    inset: 0;
    border: 2.5px solid rgba(255,233,168,0.9);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(255,233,168,0.55), inset 0 0 10px rgba(255,233,168,0.35);
    animation: spin-ring 3s linear infinite;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #magic-circle .particles {
    position: absolute;
    inset: 0;
    animation: spin-ring 2.2s linear infinite reverse;
  }
  #magic-circle .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 6px #ffe9a8;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }
  #magic-circle.hovering .ring {
    border-color: #7cffb2;
    box-shadow: 0 0 18px rgba(124,255,178,0.7), inset 0 0 12px rgba(124,255,178,0.4);
    transform: scale(1.15) rotate(0deg);
  }
  #magic-circle.hovering .particle {
    background: #7cffb2;
    box-shadow: 0 0 8px #7cffb2;
  }
  #magic-circle.active .ring {
    border-color: #ff8fab;
    box-shadow: 0 0 20px rgba(255,143,171,0.8), inset 0 0 12px rgba(255,143,171,0.45);
  }
  #magic-circle.active .particle {
    background: #ff8fab;
    box-shadow: 0 0 8px #ff8fab;
  }
 
  .cat.hoverable svg ellipse,
  .cat.hoverable svg circle:first-of-type {
    filter: drop-shadow(0 0 6px #7cffb2);
  }
  .cat.possessed {
    z-index: 50;
    animation: possessed-glow 1.1s ease-in-out infinite;
  }
  @keyframes possessed-glow {
    0%, 100% { filter: drop-shadow(0 0 4px #ff8fab); }
    50% { filter: drop-shadow(0 0 12px #ff8fab); }
  }
 
  #possess-hint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--outline);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 2px 2px 0 var(--outline);
    z-index: 210;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  #possess-hint.show { opacity: 1; }
 
  /* Porte au pied de chaque tour */
  .door {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 30px;
    background: var(--paper);
    border: 3px solid var(--outline);
    border-radius: 5px 5px 0 0;
    box-shadow: 1px 1px 0 var(--outline);
    cursor: pointer;
    z-index: 6;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .door::after {
    content: '';
    position: absolute;
    right: 4px;
    top: 50%;
    width: 3px;
    height: 3px;
    margin-top: -1.5px;
    border-radius: 50%;
    background: var(--outline);
  }
  .door:hover {
    filter: brightness(1.1);
    transform: translateX(-50%) scale(1.08);
  }
 
  /* Fenêtre d'historique (effet de zoom depuis la porte) */
  #history-modal {
    position: fixed;
    inset: 0;
    background: rgba(10,5,20,0.6);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #history-modal.open {
    opacity: 1;
    pointer-events: auto;
  }
  .history-card {
    width: min(380px, 88vw);
    max-height: 68vh;
    background: var(--paper);
    color: var(--ink);
    border: 4px solid var(--outline);
    border-radius: 12px;
    box-shadow: 5px 6px 0 var(--outline);
    padding: 16px;
    display: flex;
    flex-direction: column;
    transform: scale(0.12);
    transform-origin: var(--origin-x, 50%) var(--origin-y, 50%);
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  #history-modal.open .history-card,
  #gallery-modal.open .history-card {
    transform: scale(1);
  }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px dashed var(--outline);
  }
  #history-channel-tag {
    font-weight: 700;
    font-size: 16px;
  }
  .history-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #history-screenshot {
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--outline);
    border-radius: 50%;
    background: #ffe9a8;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #history-screenshot:hover {
    filter: brightness(1.06);
  }
  #history-close {
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--outline);
    border-radius: 50%;
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }
  .history-list {
    overflow-y: auto;
    background: #313338;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .discord-msg {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 6px 6px;
    border-radius: 6px;
  }
  .discord-msg:hover {
    background: rgba(255,255,255,0.03);
  }
  .discord-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 15px;
    overflow: hidden;
  }
  .discord-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .discord-msg-body {
    min-width: 0;
    flex: 1;
  }
  .discord-msg-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .discord-username {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }
  .discord-badge { font-size: 12px; }
  .discord-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #949ba4;
    white-space: nowrap;
  }
  .discord-text {
    font-family: 'gg sans', 'Fredoka', sans-serif;
    font-size: 14px;
    color: #dbdee1;
    line-height: 1.37;
    margin-top: 1px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .history-empty {
    text-align: center;
    font-size: 12px;
    color: #949ba4;
    padding: 20px 0;
  }
 
  /* Galerie de captures */
  #gallery-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    border: 3px solid var(--outline);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--outline);
    z-index: 205;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #gallery-btn:hover { filter: brightness(1.05); }
  #gallery-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--outline);
  }
 
  #gallery-modal {
    position: fixed;
    inset: 0;
    background: rgba(10,5,20,0.6);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #gallery-modal.open {
    opacity: 1;
    pointer-events: auto;
  }
  .gallery-card {
    transform-origin: 90% 90% !important;
  }
  .gallery-list {
    max-height: 50vh;
  }
  .gallery-entry { margin-bottom: 10px; }
  .gallery-channel-tag {
    font-family: 'Fredoka', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: #949ba4;
    padding: 0 6px 2px;
  }
 
  /* Mascottes */
  .mascot {
    position: absolute;
    bottom: 90px;
    width: 58px;
    z-index: 11;
  }
  .mascot svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.35));
  }
  .mascot.walking { animation: bob 0.6s ease-in-out infinite; }
 
  .invite-bubble {
    position: absolute;
    bottom: 168px;
    width: 200px;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--outline);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: center;
    box-shadow: 3px 4px 0 var(--outline);
    transform: translateX(-50%) scale(0.5);
    opacity: 0;
    z-index: 26;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .invite-bubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
  }
  .invite-bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -12px;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: var(--outline);
  }
  .invite-bubble::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--paper);
    z-index: 1;
  }
  .invite-bubble .invite-name {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .invite-bubble .invite-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    line-height: 1.35;
  }
  .invite-bubble .invite-link {
    display: inline-block;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: #5865f2;
    border-radius: 6px;
    padding: 4px 8px;
    text-decoration: none;
  }
  .invite-bubble .invite-link:hover { filter: brightness(1.1); }
</style>
</head>
<body>
 
<div id="scene">
  <div id="title-card">
    <h1>Cat Land</h1>
    <p>chaque tour = un salon &middot; flèches ← → pour regarder la ville</p>
    <p id="status" style="margin-top:8px; font-size:11px; opacity:0.85;">🔴 mode démo (messages fictifs)</p>
    <p id="member-count" style="margin-top:2px; font-size:11px; opacity:0.85; display:none;"></p>
  </div>
 
  <div class="moon"></div>
  <div id="stars"></div>
 
  <div id="world">
    <div id="skyline"></div>
    <div id="cats-layer"></div>
    <div id="mascots-layer"></div>
    <div id="fireflies-layer"></div>
  </div>
  <div id="ground"></div>
 
  <button type="button" class="look-btn left" id="btn-left" aria-label="Regarder à gauche">←</button>

const TOWER_PALETTE = ["#ff8fab", "#ffd166", "#a685e2", "#83c5be", "#f4a261", "#6fcf97", "#ef8354"];
 
// Hash simple pour avoir une génération stable par nom de salon
function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
 
function colorForChannel(name) {
  return TOWER_PALETTE[hashStr(name) % TOWER_PALETTE.length];
}
 
let CURRENT_CHANNELS = CHANNELS; // remplacé par la vraie liste dès que le bot se connecte
let activeSocket = null; // référence au WebSocket ouvert, pour demander l'historique
const historyCache = {};   // clé = id (ou idx) du salon -> liste de messages
const historyFetched = new Set(); // salons pour lesquels on a déjà demandé l'historique réel au bot
let currentHistoryChannel = null;
let currentHistoryKey = null;
const capturedPhotos = []; // galerie des derniers polaroids pris par les chats
 
const worldEl = document.getElementById('world');
const look = { left: false, right: false };
let cameraX = 0;
const LOOK_SPEED = 9;
 
function worldWidth() {
  const skyline = document.getElementById('skyline');
  return Math.max(window.innerWidth, skyline.scrollWidth);
}
 
function maxCamera() {
  return Math.max(0, worldWidth() - window.innerWidth);
}
 
function applyCamera() {
  cameraX = Math.max(0, Math.min(maxCamera(), cameraX));
  worldEl.style.transform = `translateX(${-cameraX}px)`;
  const leftBtn = document.getElementById('btn-left');
  const rightBtn = document.getElementById('btn-right');
  if (leftBtn) leftBtn.style.opacity = cameraX <= 0 ? '0.4' : '1';
  if (rightBtn) rightBtn.style.opacity = cameraX >= maxCamera() ? '0.4' : '1';
}
 
function bindLookControls() {
  const setHold = (side, on) => {
    look[side] = on;
    const btn = document.getElementById(side === 'left' ? 'btn-left' : 'btn-right');
    if (btn) btn.classList.toggle('held', on);
  };
 
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q' || e.key === 'a' || e.key === 'A') {
      setHold('left', true);
      e.preventDefault();
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      setHold('right', true);
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q' || e.key === 'a' || e.key === 'A') setHold('left', false);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setHold('right', false);
  });
 
  [['btn-left', 'left'], ['btn-right', 'right']].forEach(([id, side]) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    const start = (e) => { e.preventDefault(); setHold(side, true); };
    const stop = () => setHold(side, false);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
    btn.addEventListener('touchend', stop);
    btn.addEventListener('touchcancel', stop);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
  });
 
  window.addEventListener('blur', () => {
    setHold('left', false);
    setHold('right', false);
  });
 
  window.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) {
      cameraX += (e.shiftKey ? e.deltaY : e.deltaX) || e.deltaY;
      applyCamera();
      e.preventDefault();
    }
  }, { passive: false });
 
  window.addEventListener('resize', applyCamera);
}
 
function buildSkyline(channelList) {
  CURRENT_CHANNELS = channelList;
  const skyline = document.getElementById('skyline');
  skyline.innerHTML = '';
  channelList.forEach((ch, idx) => {
    const seed = hashStr(ch.name);
    const width = 78 + (seed % 40);
    const height = 190 + ((seed >> 3) % 160);
    const cols = 2 + (seed % 2);
    const rows = Math.max(3, Math.floor((height - 60) / 26));
 
    const tower = document.createElement('div');
    tower.className = 'tower';
    tower.id = 'tower-' + idx;
    tower.style.width = width + 'px';
    tower.style.height = height + 'px';
    tower.style.background = ch.color;
 
    const cap = document.createElement('div');
    cap.className = 'roof-cap';
    tower.appendChild(cap);
 
    const plate = document.createElement('div');
    plate.className = 'nameplate';
    plate.textContent = '#' + ch.name;
    tower.appendChild(plate);
 
    const windows = document.createElement('div');
    windows.className = 'windows';
    windows.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    windows.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    for (let i = 0; i < cols * rows; i++) {
      const w = document.createElement('div');
      w.className = 'window' + (((seed + i * 7) % 3 !== 0) ? ' lit' : '');
      windows.appendChild(w);
    }
    tower.appendChild(windows);
 
    const door = document.createElement('div');
    door.className = 'door';
    door.addEventListener('click', (e) => {
      e.stopPropagation();
      openHistory(idx, ch, door);
    });
    tower.appendChild(door);
 
    skyline.appendChild(tower);
  });
  applyCamera();
}
 
function buildStars() {
  const layer = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 55 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    layer.appendChild(s);
  }
}
 
function spawnShootingStar() {
  const layer = document.getElementById('stars');
  const el = document.createElement('div');
  el.className = 'shooting-star';
  el.style.top = (4 + Math.random() * 22) + '%';
  el.style.left = (55 + Math.random() * 38) + '%';

  setTimeout(() => el.remove(), 1200);
}
 
function scheduleShootingStars() {

}

  return `<svg viewBox="0 0 34 26">
    <ellipse cx="17" cy="17" rx="15" ry="9" fill="${color}" stroke="#17101f" stroke-width="2.5"/>

}
 
const CAT_COLORS = ["#ffe9a8", "#f4a9c9", "#b5ead7", "#c7b6f0", "#ffcf9e"];
 
function spawnCats(n) {
  const layer = document.getElementById('cats-layer');
  const width = worldWidth();
  const cats = [];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'cat walking';
    const color = CAT_COLORS[i % CAT_COLORS.length];
    el.innerHTML = catSVG(color);
    const startX = Math.random() * width;
    el.style.left = startX + 'px';
    layer.appendChild(el);
    cats.push({ el, x: startX, dir: Math.random() < 0.5 ? 1 : -1, speed: 0.35 + Math.random() * 0.4, paused: false });
  }
  return cats;
}
 
function animateCats(cats) {
  function step() {
    if (look.left) cameraX -= LOOK_SPEED;
    if (look.right) cameraX += LOOK_SPEED;
    applyCamera();
 
    const width = worldWidth();
    cats.forEach(cat => {
      if (cat.paused) return;
      cat.x += cat.dir * cat.speed;
      if (cat.x < -20) { cat.x = -20; cat.dir = 1; }
      if (cat.x > width - 10) { cat.x = width - 10; cat.dir = -1; }
      cat.el.style.left = cat.x + 'px';
      cat.el.style.transform = cat.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
    });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
 
function findFreeCat(cats) {
  const free = cats.filter(c => !c.paused);
  if (free.length) return free[Math.floor(Math.random() * free.length)];
  return cats[Math.floor(Math.random() * cats.length)];
}
 
function recordHistory(channel, message) {
  const key = channel.id || channel.name;
  if (!historyCache[key]) historyCache[key] = [];
  historyCache[key].push({
    author: message.author,
    text: message.text,
    timestamp: message.timestamp || Date.now(),
    avatar: message.avatar || null,
  });
  if (historyCache[key].length > 40) historyCache[key].shift();
 
  const modal = document.getElementById('history-modal');
  if (modal.classList.contains('open') &&
      document.getElementById('history-channel-tag').textContent === '#' + channel.name) {
    renderHistory(historyCache[key]);
  }
}
 
function captureAt(cats, towerEl, channel, message) {
  recordHistory(channel, message);
  addToGallery(channel, message);
  const cat = findFreeCat(cats);
  cat.paused = true;
  const worldRect = worldEl.getBoundingClientRect();
  const rect = towerEl.getBoundingClientRect();
  const targetX = rect.left - worldRect.left + rect.width / 2 - 10;
  cat.el.style.transition = 'left 0.9s ease';
  cat.el.style.left = targetX + 'px';
  cat.x = targetX;
 
  setTimeout(() => {
    showPolaroidNear(cat, towerEl, channel, message);
    setTimeout(() => {
      cat.el.style.transition = '';
      cat.paused = false;
    }, 3400);
  }, 950);
}
 
function showPolaroidNear(cat, tower, channel, message) {
  const rect = tower.getBoundingClientRect();
  const worldRect = worldEl.getBoundingClientRect();
  const attachX = rect.left - worldRect.left + rect.width / 2;
 
  // Flash de l'appareil photo, au niveau du chat
  const flash = document.createElement('div');
  flash.className = 'flash-burst';
  flash.style.left = attachX + 'px';
  flash.style.bottom = '118px';
  worldEl.appendChild(flash);
  setTimeout(() => flash.remove(), 550);
  playShutterSound();
 
  const author = message.author || '?';
  const avatarColor = colorForUsername(author);
 
  const p = document.createElement('div');
  p.className = 'polaroid';
  p.style.left = attachX + 'px';
  p.innerHTML = `
    <div class="shot">
      <div class="polaroid-msg">
        ${avatarBlock('polaroid-avatar', author, message.avatar)}
        <div class="polaroid-msg-body">
          <div class="polaroid-msg-top">
            <span class="polaroid-username" style="color:${avatarColor}">${author}</span>
            <span class="polaroid-badge">${badgeForUsername(author)}</span>
          </div>
          <div class="polaroid-text">${message.text}</div>
        </div>
      </div>
    </div>
    <div class="caption">#${channel.name} &middot; 📸 capturé</div>
  `;
  worldEl.appendChild(p);
  bindAvatarFallbacks(p);
  requestAnimationFrame(() => p.classList.add('show'));
 
  setTimeout(() => {
    p.classList.remove('show');
    setTimeout(() => p.remove(), 400);
  }, 3200);
}

  return new Date(ts).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
 
function seedDemoHistory(channel) {
  const seed = hashStr(channel.name);
  const count = 3 + (seed % 3);
  const list = [];
  for (let i = 0; i < count; i++) {
    const m = MOCK_MESSAGES[(seed + i * 3) % MOCK_MESSAGES.length];
    list.push({ author: m.author, text: m.text, timestamp: Date.now() - (count - i) * 3600000 });
  }
  return list;
}

const INVITE_LINK = "invites.gg/catland";
 
function spawnMascots() {
  const layer = document.getElementById('mascots-layer');
  const width = worldWidth();
  const mascots = [];
  MASCOTS.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'mascot walking';
    el.innerHTML = m.svg;
    const startX = (width / (MASCOTS.length + 1)) * (i + 1);
    el.style.left = startX + 'px';
    layer.appendChild(el);
    mascots.push({ el, name: m.name, x: startX, dir: Math.random() < 0.5 ? 1 : -1, speed: 0.22 + Math.random() * 0.18 });
  });
  return mascots;
}
 
function animateMascots(mascots) {
  function step() {
    const width = worldWidth();
    mascots.forEach(m => {
      m.x += m.dir * m.speed;
      if (m.x < -10) { m.x = -10; m.dir = 1; }
      if (m.x > width) { m.x = width; m.dir = -1; }
      m.el.style.left = m.x + 'px';
      m.el.style.transform = m.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
    });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
 
function showInviteBubble(mascot) {
  const worldRect = worldEl.getBoundingClientRect();
  const rect = mascot.el.getBoundingClientRect();
  const attachX = rect.left - worldRect.left + rect.width / 2;
 
  const bubble = document.createElement('div');
  bubble.className = 'invite-bubble';
  bubble.style.left = attachX + 'px';
  bubble.innerHTML = `
    <div class="invite-name">${mascot.name}</div>
    <div class="invite-text">Viens rejoindre Cat Land avec nous ! 🐾</div>
    <a class="invite-link" href="https://${INVITE_LINK}" target="_blank" rel="noopener">${INVITE_LINK}</a>
  `;
  worldEl.appendChild(bubble);
  requestAnimationFrame(() => bubble.classList.add('show'));
 
  setTimeout(() => {
    bubble.classList.remove('show');
    setTimeout(() => bubble.remove(), 350);
  }, 4500);
}
 
function scheduleInvites(mascots) {
  function next() {
    const mascot = mascots[Math.floor(Math.random() * mascots.length)];
    showInviteBubble(mascot);
    setTimeout(next, 9000 + Math.random() * 6000);
  }
  setTimeout(next, 3500);
}
 
const USERNAME_COLORS = ["#f47fff", "#5cd6ff", "#ffb454", "#7cffb2", "#ff8fab", "#c9a6ff", "#7289da", "#f2b705"];
function colorForUsername(name) {
  return USERNAME_COLORS[hashStr(name || '?') % USERNAME_COLORS.length];
}
 
// Génère le HTML d'un avatar (classe CSS paramétrable) avec repli automatique sur une initiale colorée
// si l'image ne charge pas (CORS, lien mort, etc.)
function avatarBlock(className, author, avatarUrl) {
  const name = author || '?';
  const color = colorForUsername(name);
  const initials = name.trim().charAt(0).toUpperCase();
  if (avatarUrl) {
    return `<div class="${className}" style="background:#1e1f22">
      <img src="${avatarUrl}" alt="" class="avatar-img" data-fallback="${initials}" data-color="${color}">
    </div>`;
  }
  return `<div class="${className}" style="background:${color}">${initials}</div>`;
}
 
// À appeler juste après avoir inséré du HTML contenant des avatars : bascule sur la lettre si l'image échoue
function bindAvatarFallbacks(root) {
  root.querySelectorAll('img.avatar-img').forEach(img => {
    img.addEventListener('error', () => {
      const wrap = img.parentElement;
      if (!wrap) return;
      wrap.style.background = img.dataset.color || '#5865f2';
      wrap.textContent = img.dataset.fallback || '?';
    }, { once: true });
  });
}
 
const AUTHOR_BADGES = ["🐾", "✨", "🔥", "🎮", "🍪", "🎨", "🎧", "🌙"];
function badgeForUsername(name) {
  return AUTHOR_BADGES[hashStr((name || '?') + 'badge') % AUTHOR_BADGES.length];
}
 
function renderHistory(messages) {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!messages.length) {
    list.innerHTML = '<div class="history-empty">Aucun message pour l\'instant.</div>';
    return;
  }
  messages.forEach(m => {
    const item = document.createElement('div');
    item.className = 'discord-msg';
    const author = m.author || '?';
    const avatarColor = colorForUsername(author);
    item.innerHTML = `
      ${avatarBlock('discord-avatar', author, m.avatar)}
      <div class="discord-msg-body">
        <div class="discord-msg-top">
          <span class="discord-username" style="color:${avatarColor}">${author}</span>
          <span class="discord-badge">${badgeForUsername(author)}</span>
          <span class="discord-time">${formatTime(m.timestamp)}</span>
        </div>
        <div class="discord-text">${m.text}</div>
      </div>
    `;
    list.appendChild(item);
  });
  bindAvatarFallbacks(list);
  list.scrollTop = list.scrollHeight;
}
 
function openHistory(idx, channel, doorEl) {
  const modal = document.getElementById('history-modal');
  const card = modal.querySelector('.history-card');
  const rect = doorEl.getBoundingClientRect();
  card.style.setProperty('--origin-x', (rect.left + rect.width / 2) + 'px');
  card.style.setProperty('--origin-y', (rect.top + rect.height / 2) + 'px');
 
  document.getElementById('history-channel-tag').textContent = '#' + channel.name;
 
  const key = channel.id || ('idx-' + idx);
  currentHistoryChannel = channel;
  currentHistoryKey = key;
  if (!historyCache[key]) historyCache[key] = [];
 
  const canFetchReal = channel.id && activeSocket && activeSocket.readyState === WebSocket.OPEN && !historyFetched.has(key);
  if (canFetchReal) {
    document.getElementById('history-list').innerHTML = historyCache[key].length
      ? ''
      : '<div class="history-empty">Chargement de l\'historique…</div>';
    if (historyCache[key].length) renderHistory(historyCache[key]);
    activeSocket.send(JSON.stringify({ type: 'request_history', channelId: channel.id }));
    historyFetched.add(key);
  } else {
    if (!historyCache[key].length && !channel.id) {
      historyCache[key] = seedDemoHistory(channel);
    }
    renderHistory(historyCache[key]);
  }
 
  modal.classList.add('open');
}
 
function closeHistory() {
  document.getElementById('history-modal').classList.remove('open');
}
 
function realScreenshot() {
  const card = document.querySelector('.history-card');
  const btn = document.getElementById('history-screenshot');
  if (!card || typeof html2canvas === 'undefined') return;
 
  btn.disabled = true;
  const originalIcon = btn.textContent;
  btn.textContent = '⏳';
 
  // on cache temporairement les boutons pour qu'ils n'apparaissent pas dans le screenshot
  const actions = document.querySelector('.history-header-actions');
  actions.style.visibility = 'hidden';
 
  html2canvas(card, { backgroundColor: '#f4ecd8', scale: 2, useCORS: true }).then(canvas => {
    const safeName = (currentHistoryChannel?.name || 'salon').replace(/[^a-z0-9-_]/gi, '_');
    const link = document.createElement('a');
    link.download = `catland-${safeName}-screenshot.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).finally(() => {
    actions.style.visibility = '';
    btn.textContent = originalIcon;
    btn.disabled = false;
  });
}
 
document.getElementById('history-screenshot').addEventListener('click', (e) => {
  e.stopPropagation();
  realScreenshot();
});
 
document.getElementById('history-close').addEventListener('click', (e) => { e.stopPropagation(); closeHistory(); });
document.getElementById('history-modal').addEventListener('click', (e) => {
  if (e.target.id === 'history-modal') closeHistory();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeHistory(); closeGallery(); }
});
 
// ---------- Petit bruit de déclencheur (synthétisé, sans fichier audio) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* audio indisponible */ }
  }
}
document.addEventListener('click', ensureAudio, { once: true });
document.addEventListener('keydown', ensureAudio, { once: true });
 
function playShutterSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1900, now);
  osc.frequency.exponentialRampToValueAtTime(350, now + 0.07);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}
 
function addToGallery(channel, message) {
  capturedPhotos.unshift({
    channelName: channel.name,
    author: message.author,
    text: message.text,
    timestamp: message.timestamp || Date.now(),
    avatar: message.avatar || null,
  });
  if (capturedPhotos.length > 24) capturedPhotos.length = 24;
  const countEl = document.getElementById('gallery-count');
  if (countEl) countEl.textContent = capturedPhotos.length;
  if (document.getElementById('gallery-modal').classList.contains('open')) {
    renderGallery();
  }
}
 
function renderGallery() {
  const list = document.getElementById('gallery-list');
  list.innerHTML = '';
  if (!capturedPhotos.length) {
    list.innerHTML = '<div class="history-empty">Pas encore de capture &middot; attends qu\'un chat prenne une photo !</div>';
    return;
  }
  capturedPhotos.forEach(p => {
    const author = p.author || '?';
    const avatarColor = colorForUsername(author);
 
    const wrap = document.createElement('div');
    wrap.className = 'gallery-entry';
    wrap.innerHTML = `
      <div class="gallery-channel-tag">#${p.channelName}</div>
      <div class="discord-msg">
        ${avatarBlock('discord-avatar', author, p.avatar)}
        <div class="discord-msg-body">
          <div class="discord-msg-top">
            <span class="discord-username" style="color:${avatarColor}">${author}</span>
            <span class="discord-badge">${badgeForUsername(author)}</span>
            <span class="discord-time">${formatTime(p.timestamp)}</span>
          </div>
          <div class="discord-text">${p.text}</div>
        </div>
      </div>
    `;
    list.appendChild(wrap);
  });
  bindAvatarFallbacks(list);
}
 
function openGallery() {
  renderGallery();
  document.getElementById('gallery-modal').classList.add('open');
}
function closeGallery() {
  document.getElementById('gallery-modal').classList.remove('open');
}
document.getElementById('gallery-btn').addEventListener('click', (e) => { e.stopPropagation(); openGallery(); });
document.getElementById('gallery-close').addEventListener('click', (e) => { e.stopPropagation(); closeGallery(); });
document.getElementById('gallery-modal').addEventListener('click', (e) => {
  if (e.target.id === 'gallery-modal') closeGallery();
});
 
function scheduleMockCaptures(cats) {
  return setInterval(() => {
    const towers = document.querySelectorAll('.tower');
    if (!towers.length) return;
    const towerEl = towers[Math.floor(Math.random() * towers.length)];
    const channelIdx = parseInt(towerEl.id.split('-')[1], 10);
    const channel = CURRENT_CHANNELS[channelIdx];
    const message = MOCK_MESSAGES[Math.floor(Math.random() * MOCK_MESSAGES.length)];
    captureAt(cats, towerEl, channel, message);
  }, 2600);
}
 
function setStatus(text) {
  const el = document.getElementById('status');
  if (el) el.textContent = text;
}
 
function connectToBot(cats) {
  let mockTimer = setTimeout(() => {
    mockTimer = scheduleMockCaptures(cats);
  }, 2500); // laisse 2.5s au bot pour répondre avant de retomber en démo
 
  let ws;
  try {
    ws = new WebSocket('ws://localhost:8765');
  } catch (e) {
    return; // reste en mode démo
  }
 
  ws.addEventListener('open', () => {
    clearTimeout(mockTimer);
    clearInterval(mockTimer);
    activeSocket = ws;
    setStatus('🟢 en direct — connecté au serveur Cat Land');
  });
 
  ws.addEventListener('message', (evt) => {
    let data;
    try { data = JSON.parse(evt.data); } catch (e) { return; }
 
    if (data.type === 'channels' && data.channels?.length) {
      const channelList = data.channels.map(c => ({
        id: c.id,
        name: c.name,
        color: colorForChannel(c.name),
      }));
      buildSkyline(channelList);
      applyCamera();
 
      if (typeof data.memberCount === 'number') {
        const el = document.getElementById('member-count');
        el.textContent = `🐾 ${data.memberCount} membres sur le serveur`;
        el.style.display = 'block';
      }
    }
 
    if (data.type === 'message') {
      const idx = CURRENT_CHANNELS.findIndex(c => c.id === data.channelId || c.name === data.channelName);
      if (idx === -1) return;
      const towerEl = document.getElementById('tower-' + idx);
      if (!towerEl) return;
      captureAt(cats, towerEl, CURRENT_CHANNELS[idx], { author: data.author, text: data.text, timestamp: data.timestamp, avatar: data.avatar });
    }
 
    if (data.type === 'history' && data.channelId) {
      const key = data.channelId;
      const fetched = (data.messages || []).map(m => ({ author: m.author, text: m.text, timestamp: m.timestamp, avatar: m.avatar }));
      historyCache[key] = fetched.concat(historyCache[key] || []);
      const openChannel = CURRENT_CHANNELS.find(c => c.id === key);
      const modal = document.getElementById('history-modal');
      if (openChannel && modal.classList.contains('open') &&
          document.getElementById('history-channel-tag').textContent === '#' + openChannel.name) {
        renderHistory(historyCache[key]);
      }
    }
  });
 
  ws.addEventListener('close', () => {
    activeSocket = null;
    setStatus('🔴 mode démo (bot déconnecté)');
    document.getElementById('member-count').style.display = 'none';
    if (!mockTimer) mockTimer = scheduleMockCaptures(cats);
  });
 
  ws.addEventListener('error', () => {
    // silencieux : le fallback démo prend déjà le relais
  });
}
 
const POSSESS_RADIUS = 34; // distance (px écran) sous laquelle le cercle "attrape" un chat
 
function initMagicCircle(cats) {
  const circle = document.getElementById('magic-circle');
  const hint = document.getElementById('possess-hint');
 
  let rawX = window.innerWidth / 2;
  let rawY = window.innerHeight / 2;
  let circleX = rawX;
  let circleY = rawY;
  let hoveredCat = null;
  let possessedCat = null;
 
  window.addEventListener('mousemove', (e) => {
    rawX = e.clientX;
    rawY = e.clientY;
  });
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      rawX = e.touches[0].clientX;
      rawY = e.touches[0].clientY;
    }
  }, { passive: true });
 
  function nearestCatToCircle() {
    let best = null;
    let bestDist = POSSESS_RADIUS;
    cats.forEach(cat => {
      if (cat.possessed) return;
      const r = cat.el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const d = Math.hypot(cx - circleX, cy - circleY);
      if (d < bestDist) { bestDist = d; best = cat; }
    });
    return best;
  }
 
  function releasePossession() {
    if (!possessedCat) return;
    possessedCat.possessed = false;
    possessedCat.paused = false;
    possessedCat.el.classList.remove('possessed');
    possessedCat = null;
    circle.classList.remove('active');
    hint.classList.remove('show');
  }
 
  function possess(cat) {
    releasePossession();
    possessedCat = cat;
    cat.possessed = true;
    cat.paused = true;
    cat.el.classList.add('possessed');
    circle.classList.add('active');
  }
 
  document.addEventListener('click', (e) => {
    if (e.target.closest('.look-btn')) return;
    if (possessedCat) {
      releasePossession();
      return;
    }
    if (hoveredCat) {
      possess(hoveredCat);
    }
  });
 
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') releasePossession();
  });
 
  function tick() {
    // lissage du cercle vers la position de la souris
    circleX += (rawX - circleX) * 0.28;
    circleY += (rawY - circleY) * 0.28;
    circle.style.transform = `translate(${circleX}px, ${circleY}px)`;
 
    if (!possessedCat) {
      const near = nearestCatToCircle();
      if (near !== hoveredCat) {
        if (hoveredCat) hoveredCat.el.classList.remove('hoverable');
        hoveredCat = near;
        if (hoveredCat) hoveredCat.el.classList.add('hoverable');
      }
      circle.classList.toggle('hovering', !!hoveredCat);
      hint.classList.toggle('show', !!hoveredCat);
    } else {
      // le chat possédé suit le cercle (coordonnées converties dans le repère du monde)
      const worldX = circleX + cameraX - 17;
      possessedCat.x = worldX;
      possessedCat.el.style.left = worldX + 'px';
      possessedCat.el.style.transform = (rawX < (possessedCat._lastX ?? rawX)) ? 'scaleX(-1)' : 'scaleX(1)';
      possessedCat._lastX = rawX;
 
      // la caméra suit si le chat possédé approche des bords
      const margin = 90;
      if (circleX < margin) cameraX -= (margin - circleX) * 0.15;
      if (circleX > window.innerWidth - margin) cameraX += (circleX - (window.innerWidth - margin)) * 0.15;
      applyCamera();
 
      hint.classList.add('show');
    }
 
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
